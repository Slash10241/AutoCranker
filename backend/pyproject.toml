[project]
name = "autocranker-backend"
version = "0.1.0"
description = "FastAPI backend for AutoCranker WhatsApp bot via Make.com."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "google-genai>=1.75.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]==0.32.0",
]

[tool.uv]
package = false
